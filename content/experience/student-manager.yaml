bullets:
  - Manage day-to-day operations for the UW softball team as a student manager.
  - >-
    Set up and tear down equipment for every practice and game, keeping things
    on schedule.
  - >-
    Track game stats for the coaching staff to use during and after games via
    the softwares Trackman, HitTrax, Dartfish, and game-film camera setup.
  - >-
    Coordinate with coaches and players on travel plans, practice times, and
    equipment needs.
  - Represent the program professionally at practices, games, and team events.
